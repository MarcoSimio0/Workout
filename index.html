<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="La mia scheda di palestra: allenamento, storico e scambio dati con Claude.">
  <title>Scheda Palestra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="barra-alta"><h1 id="titolo">Allena</h1></header>

  <main id="contenuto"><p class="vuoto">Caricamento…</p></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-info">
      <div id="timer-etichetta" class="etichetta">Recupero</div>
      <div id="timer-nome" class="timer-nome"></div>
    </div>
    <div id="timer-tempo" class="timer-tempo">0:00</div>
    <div class="timer-azioni">
      <button class="btn" data-timer="-15">−15"</button>
      <button class="btn" data-timer="+15">+15"</button>
      <button class="btn" data-timer="salta">Salta</button>
    </div>
    <div class="timer-progresso"><div id="timer-barra"></div></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="dialogo" class="dialogo" hidden>
    <div class="dialogo-box" role="alertdialog" aria-modal="true" aria-labelledby="dialogo-testo">
      <p id="dialogo-testo"></p>
      <div class="riga-bottoni">
        <button class="btn" data-dialogo="no">Indietro</button>
        <button class="btn primario" data-dialogo="si" id="dialogo-ok">Conferma</button>
      </div>
    </div>
  </div>

  <nav class="tab">
    <button data-vista="allena" class="attiva">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>
      Allena
    </button>
    <button data-vista="scheda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Scheda
    </button>
    <button data-vista="storico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      Storico
    </button>
    <button data-vista="dati">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13M3 13l4 4 4-4M17 20V7M13 11l4-4 4 4"/></svg>
      Dati
    </button>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
